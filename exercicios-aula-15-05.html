<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Exercicios Aula 15/05</title>
        <link rel="stylesheet" href="assets/css/exercicio-aula-15-05.css" />
    </head>
    <body>
        <h1>Exercicio 01</h1>
        <h2>Destaque de Produto</h2>
        <div id="caixa" class="caixa">
            <p>Iphone 17pro max 1 tb</p>
        </div>
        <button onclick="mudarCor('vermelho')">Vermelho</button>
        <button onclick="mudarCor('azul')">Azul</button>
        <button onclick="mudarCor('verde')">Verde</button>
        <button onclick="aumentarCaixa()">Aumentar</button>
        <button onclick="resetarCaixa()">Redefinir</button>

        <h1>Exercicio 02</h1>
        <h2>Perfil de Usuário</h2>
        <input type="text" id="nome" placeholder="Digite seu nome" />
        <select id="tema">
            <option value="tema-azul">Tema Azul</option>
            <option value="tema-verde">Tema Verde</option>
            <option value="tema-vermelho">Tema Vermelho</option>
        </select>
        <label>
            <input type="checkbox" id="destaque" />
            Modo destaque
        </label>
        <br /><br />
        <button onclick="aplicarAlteracoes()">Aplicar Alterações</button>
        <br /><br />
        <div id="card" class="card">
            <img
                src="https://s2-techtudo.glbimg.com/cEZr7x8qU-uBuk6a7pGLiMcj-a8=/0x0:695x496/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_08fbf48bc0524877943fe86e43087e7a/internal_photos/bs/2021/z/8/AM4aWnQ8aBOIJHmDbgFg/2015-04-01-ha-ha-nelson-simpsons-1.jpg"
                alt="Foto Perfil"
            />
            <h2 id="nome-card">Nome do Usuário</h2>
        </div>

        <h1>Exercicio 03</h1>
        <h2>Pagina de cadastro</h2>
        <div>
            <input type="text" id="nome" placeholder="Digite seu nome" />
        </div>
        <div>Selecione o Cadastro</div>
        <div class="selecao">
            <input
                type="radio"
                id="pf"
                name="tipo"
                value="pf"
                onchange="apresentarDadosPessoaFisica()"
            />
            <label for="pf">Pessoa Física</label>
            <input type="radio" id="pj" name="tipo" value="pj" />
            <label for="pj">Pessoa Jurídica</label>
        </div>

        <script src="assets/js/exercicio-aula-15-05.js"></script>
    </body>
</html>
